name: MS BFF Deploy

on:
  push:
    branches:
      - main
    paths:
      - "Dockerfile"
      - "src/**"
      - "pom.xml"
      - ".github/workflows/**"
  workflow_dispatch:

env:
  CONTAINER_NAME: ms-bff
  HOST_PORT: 8085
  CONTAINER_PORT: 8085

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Build JAR
        run: |
          chmod +x ./mvnw
          ./mvnw clean package

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: |
          docker build -t ms-bff:latest .
          docker tag ms-bff:latest \
            ${{ secrets.ECR_REPO_URL_MS_BFF }}:latest

      - name: Push image to ECR
        run: |
          docker push \
            ${{ secrets.ECR_REPO_URL_MS_BFF }}:latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
          ECR_REPO: ${{ secrets.ECR_REPO_URL_MS_BFF }}
          URL_REPORT: ${{ secrets.URL_REPORT }}
          URL_AUDIT: ${{ secrets.URL_AUDIT }}
          URL_CATALOG: ${{ secrets.GATEWAY_IP }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}

          envs: AWS_ACCESS_KEY_ID,AWS_SECRET_ACCESS_KEY,AWS_SESSION_TOKEN,AWS_REGION,ECR_REGISTRY,ECR_REPO,URL_REPORT,URL_AUDIT,URL_CATALOG

          script: |
            set -e

            echo "Logging into ECR..."

            aws ecr get-login-password \
              --region "$AWS_REGION" \
              | docker login \
                --username AWS \
                --password-stdin "$ECR_REGISTRY"

            echo "Pulling ms-bff..."

            docker pull "$ECR_REPO:latest"

            echo "Stopping previous container..."

            docker stop ms-bff || true
            docker rm ms-bff || true

            echo "Starting ms-bff..."

            docker run -d \
            --name ms-bff \
            --restart unless-stopped \
            -p 8085:8085 \
            -e MS_REPORT="$URL_REPORT" \
            -e MS_AUDIT="$URL_AUDIT" \
            -e MS_CATALOG="$URL_CATALOG" \
            "$ECR_REPO:latest"

            echo "Deployment completed."

            docker ps
